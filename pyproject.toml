[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentflow"
version = "0.2.0"
description = "AI Agent workflow platform - agentflow"
readme = "overview.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ct" }]

dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    # 数据库
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # 安全/鉴权
    "bcrypt>=4.0",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "slowapi>=0.1.9",
    "simpleeval>=1.0",
    # LLM / Agent / Workflow
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.40",
    "tiktoken>=0.8",
    # 向量库 / RAG
    "pymilvus>=3.0",
    "milvus-lite>=3.0",
    "pypdf>=6.0",
    "python-docx>=1.1",
    "jieba>=0.42",
    # MCP
    "mcp>=1.0",
    # 工具/CLI
    "typer>=0.12",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "zstandard>=0.23",
    "filelock>=3.16",
    "psutil>=6.0",
    "python-dateutil>=2.9",
    # Windows 专属
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
agentflow = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
